<body class="h-screen overflow-hidden text-white">
  <main data-viewport-mode="app-shell" class="finaldefense-grid h-screen min-h-0 overflow-hidden px-5 py-5 lg:px-6">
    <div data-scroll-region="primary" class="grid h-full min-h-0 overflow-y-auto gap-5 lg:grid-cols-[360px_minmax(0,1fr)]">
      <section class="finaldefense-panel relative flex min-h-0 flex-col overflow-hidden rounded-[28px] p-5">
        <div class="absolute inset-x-0 top-0 h-1" style="background:linear-gradient(90deg, #ff6b9f 0%, #7f83ff 55%, #ffb85c 100%);"></div>
        <div class="mb-5 flex items-center justify-between">
          <div>
            <p class="finaldefense-hud-label">Player Profile</p>
            <h1 class="mt-2 text-[30px] font-black leading-none">人格建档</h1>
          </div>
          <div class="flex h-14 w-14 items-center justify-center rounded-[18px] border" style="background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.1);">
            <i data-lucide="shield-half" class="h-7 w-7" style="color:#ff6b9f;"></i>
          </div>
        </div>

        <div class="mb-5 rounded-[24px] border p-4" style="background:linear-gradient(180deg, rgba(255,107,159,0.18) 0%, rgba(127,131,255,0.12) 100%); border-color:rgba(255,255,255,0.12);">
          <div class="mb-4 flex items-center gap-4">
            <div class="flex h-20 w-20 items-center justify-center rounded-[22px] text-white" style="background:linear-gradient(135deg, #ff6b9f 0%, #7f83ff 100%); box-shadow:0 12px 24px rgba(0,0,0,0.24);">
              <i data-lucide="sparkles" class="h-10 w-10"></i>
            </div>
            <div>
              <p class="finaldefense-hud-label">Current Route</p>
              <p class="mt-2 text-2xl font-black">学术人 · 夜战型</p>
              <p class="mt-2 text-sm leading-6 text-white/70">开局更像角色卡建档，而不是网页介绍模块。</p>
            </div>
          </div>
          <div class="grid gap-3 sm:grid-cols-2">
            <div class="rounded-[18px] border p-3" style="background:rgba(18,15,25,0.32); border-color:rgba(255,255,255,0.08);">
              <div class="mb-1 flex items-center justify-between text-sm"><span class="text-white/70">学力</span><span class="font-bold text-[#7f83ff]">13</span></div>
              <div class="h-2 rounded-full bg-white/10"><div class="h-2 rounded-full" style="width:72%; background:linear-gradient(90deg, #7f83ff 0%, #b08cff 100%);"></div></div>
            </div>
            <div class="rounded-[18px] border p-3" style="background:rgba(18,15,25,0.32); border-color:rgba(255,255,255,0.08);">
              <div class="mb-1 flex items-center justify-between text-sm"><span class="text-white/70">情绪</span><span class="font-bold text-[#ff6b9f]">17</span></div>
              <div class="h-2 rounded-full bg-white/10"><div class="h-2 rounded-full" style="width:81%; background:linear-gradient(90deg, #ff6b9f 0%, #ff9ac1 100%);"></div></div>
            </div>
            <div class="rounded-[18px] border p-3" style="background:rgba(18,15,25,0.32); border-color:rgba(255,255,255,0.08);">
              <div class="mb-1 flex items-center justify-between text-sm"><span class="text-white/70">体力</span><span class="font-bold text-[#ffb85c]">11</span></div>
              <div class="h-2 rounded-full bg-white/10"><div class="h-2 rounded-full" style="width:63%; background:linear-gradient(90deg, #ffb85c 0%, #ffd389 100%);"></div></div>
            </div>
            <div class="rounded-[18px] border p-3" style="background:rgba(18,15,25,0.32); border-color:rgba(255,255,255,0.08);">
              <div class="mb-1 flex items-center justify-between text-sm"><span class="text-white/70">毅力</span><span class="font-bold text-[#45d19c]">14</span></div>
              <div class="h-2 rounded-full bg-white/10"><div class="h-2 rounded-full" style="width:68%; background:linear-gradient(90deg, #45d19c 0%, #8df1c8 100%);"></div></div>
            </div>
          </div>
        </div>

        <div class="grid gap-3">
          <div class="rounded-[20px] border p-4" style="background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.08);">
            <p class="finaldefense-hud-label">Role Passive</p>
            <p class="mt-2 text-lg font-bold">夜间学习收益 +20%</p>
            <p class="mt-2 text-sm leading-6 text-white/65">把人格、加成和成长趋势做成一眼能懂的 RPG 面板表达。</p>
          </div>
          <div class="rounded-[20px] border p-4" style="background:rgba(255,255,255,0.04); border-color:rgba(255,255,255,0.08);">
            <p class="finaldefense-hud-label">World Tone</p>
            <p class="mt-2 text-sm leading-7 text-white/70">“你不是在做题，而是在组一套期末求生阵容。”</p>
          </div>
        </div>
      </section>

      <section class="finaldefense-panel min-h-0 rounded-[28px] p-5 lg:p-6">
        <div class="mb-5 flex flex-wrap items-start justify-between gap-4">
          <div>
            <p class="finaldefense-hud-label">Question 03 / 10</p>
            <h2 class="mt-2 max-w-[18ch] text-[34px] font-black leading-[1.02]" style="text-wrap:balance; word-break:keep-all; overflow-wrap:break-word;">考试前一晚，你通常在做什么？</h2>
